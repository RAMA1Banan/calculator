<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator</title>
<style>
body{
    margin:0;
    display:flex;
    flex-direction: column; /* لجعل النص يظهر أسفل الآلة الحاسبة وليس بجانبها */
    justify-content:center;
    align-items:center;
    height:100vh;
    background:#111;
    font-family:Arial;
    overflow: hidden; /* لمنع ظهور أشرطة التمرير الخاصة بالمتصفح */
}
.calculator{
    background:#222;
    padding:20px;
    border-radius:20px;
    width:350px;
    box-shadow: 0 0 20px black;
}
#display{
    width:100%;
    height:80px;
    font-size:35px;
    text-align:right;
    border:none;
    margin-bottom:15px;
    box-sizing: border-box; /* لضبط أبعاد الشاشة الداخلية بدقة */
    padding-right: 10px;
}
button{
    width:75px;
    height:75px;
    margin:3px;
    border:none;
    border-radius:50%;
    font-size:28px;
    cursor:pointer;
}
.operator{
    background:orange;
    color:white;
}
/* تنسيق شريط التمرير النصي المتناسق مع تصميم الآلة */
.designer-text {
    width: 350px; /* نفس عرض الآلة الحاسبة تماماً */
    color: orange; /* لون برتقالي ليتناسق مع أزرار العمليات الحسابية */
    font-family: Arial, sans-serif;
    font-size: 18px;
    font-weight: bold;
    margin-top: 20px; /* مسافة فاصلة بين الآلة والنص */
}
</style>
</head>
<body>

<div class="calculator">
<input type="text" id="display" readonly>
<div>
<button onclick="clearDisplay()">C</button>
<button onclick="append('/')">÷</button>
<button onclick="append('*')">×</button>
<button class="operator" onclick="append('-')">-</button>
</div>
<div>
<button onclick="append('7')">7</button>
<button onclick="append('8')">8</button>
<button onclick="append('9')">9</button>
<button class="operator" onclick="append('+')">+</button>
</div>
<div>
<button onclick="append('4')">4</button>
<button onclick="append('5')">5</button>
<button onclick="append('6')">6</button>
<button class="operator" onclick="append('%')">%</button>
</div>
<div>
<button onclick="append('1')">1</button>
<button onclick="append('2')">2</button>
<button onclick="append('3')">3</button>
<button class="operator" onclick="calculate()">=</button>
</div>
<div>
<button style="width:156px;border-radius:40px;" onclick="append('0')">0</button>
<button onclick="append('.')">.</button>
</div>
</div>

<!-- شريط التمرير النصي المتحرك بحقوق التصميم -->
<marquee class="designer-text" behavior="scroll" direction="left" scrollamount="5">
    Designed by Rama and Banan Al-Haj Abdo
</marquee>

<script>
function append(value){
 document.getElementById("display").value += value;
}
function clearDisplay(){
 document.getElementById("display").value = "";
}
function calculate(){
 try{
   // حساب العملية الحسابية بأمان
   document.getElementById("display").value = eval(document.getElementById("display").value);
 }catch(e){
   // تنبيه في حال وجود خطأ في المدخلات الحسابية
   alert("Error in Expression");
 }
}
</script>
</body>
</html>
